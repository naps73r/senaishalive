<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Alaina Live</title>
  <meta name="description" content="Alaina Live — your live radio stations in one beautiful player.">

  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #031a20;
      --scene-bg:
        radial-gradient(circle at 15% 20%, rgba(31, 197, 213, .15), transparent 30%),
        radial-gradient(circle at 84% 15%, rgba(139, 92, 246, .13), transparent 28%),
        linear-gradient(145deg, #03171c 0%, #04242c 48%, #06151d 100%);
      --orb-a: rgba(32, 213, 220, .30);
      --orb-b: rgba(92, 77, 225, .25);
      --glass: rgba(12, 34, 40, .52);
      --glass-strong: rgba(10, 27, 33, .72);
      --glass-soft: rgba(255, 255, 255, .075);
      --border: rgba(255, 255, 255, .14);
      --border-strong: rgba(255, 255, 255, .24);
      --text: #f7fbfc;
      --muted: rgba(235, 247, 250, .62);
      --accent: #67e8f9;
      --accent2: #8b5cf6;
      --success: #5ee6a8;
      --danger: #ff7d87;
      --shadow: 0 28px 90px rgba(0, 0, 0, .42);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--scene-bg);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      padding:
        calc(env(safe-area-inset-top) + 18px)
        calc(env(safe-area-inset-right) + 18px)
        calc(env(safe-area-inset-bottom) + 28px)
        calc(env(safe-area-inset-left) + 18px);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -2;
      width: 48vw;
      height: 48vw;
      min-width: 420px;
      min-height: 420px;
      border-radius: 50%;
      filter: blur(72px);
      pointer-events: none;
      opacity: .33;
      will-change: transform;
    }

    body::before {
      left: -16vw;
      top: 8vh;
      background: var(--orb-a);
      animation: driftOne 18s ease-in-out infinite alternate;
    }

    body::after {
      right: -18vw;
      bottom: -12vh;
      background: var(--orb-b);
      animation: driftTwo 22s ease-in-out infinite alternate;
    }

    .ambient-grid {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 85%);
    }

    @keyframes driftOne {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(14vw,5vh,0) scale(1.14); }
    }

    @keyframes driftTwo {
      from { transform: translate3d(0,0,0) scale(1.06); }
      to { transform: translate3d(-11vw,-8vh,0) scale(.92); }
    }

    button, input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      position: relative;
      z-index: 2;
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 6px 18px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand-name {
      font-family: Lobster, cursive;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: .01em;
      text-shadow: 0 5px 28px rgba(255,255,255,.16);
      white-space: nowrap;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .install-btn {
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }

    .install-btn.visible {
      display: inline-flex;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--border);
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.10);
      backdrop-filter: blur(30px) saturate(145%);
      -webkit-backdrop-filter: blur(30px) saturate(145%);
    }

    .player-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(260px, 330px) 1fr;
      gap: clamp(26px, 5vw, 58px);
      align-items: center;
      padding: clamp(24px, 4vw, 42px);
      border-radius: var(--radius-xl);
    }

    .player-card::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      right: -180px;
      top: -190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(103,232,249,.13), transparent 67%);
      pointer-events: none;
    }

    .cover-wrap {
      position: relative;
      width: min(100%, 310px);
      aspect-ratio: 1;
      justify-self: center;
    }

    .cover-glow {
      position: absolute;
      inset: 12%;
      border-radius: 32%;
      background: rgba(69, 224, 232, .22);
      filter: blur(48px);
      opacity: .7;
      transform: translateY(16px);
      pointer-events: none;
    }

    #coverArt {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 29px;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow:
        0 28px 55px rgba(0,0,0,.42),
        0 2px 0 rgba(255,255,255,.08) inset;
      background: rgba(255,255,255,.05);
    }

    .player-panel {
      min-width: 0;
      text-align: left;
      align-self: center;
      width: 100%;
      max-width: 680px;
      height: min(100%, 310px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .player-top {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-bottom {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      box-shadow: 0 0 0 0 rgba(94,230,168,.4);
      transition: .25s ease;
    }

    .player-card.is-playing .live-dot {
      background: var(--success);
      box-shadow: 0 0 0 6px rgba(94,230,168,.10);
    }

    #nowPlayingText {
      max-width: 680px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(1.85rem, 4.7vw, 3.95rem);
      line-height: 1.04;
      letter-spacing: -.055em;
      font-weight: 700;
      margin-bottom: 0;
    }

    #stationRegion {
      color: var(--muted);
      font-size: .96rem;
      font-weight: 500;
      min-height: 1.3em;
    }

    .equalizer-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0;
    }

    .equalizer {
      width: min(430px, 100%);
      height: 64px;
      display: flex;
      align-items: center;
      gap: clamp(3px, .55vw, 6px);
      overflow: hidden;
      padding: 5px 0;
    }

    .equalizer span {
      flex: 1;
      min-width: 3px;
      max-width: 8px;
      height: 100%;
      border-radius: 999px;
      transform-origin: center;
      transform: scaleY(.12);
      opacity: .32;
      background: linear-gradient(to top, rgba(103,232,249,.55), rgba(255,255,255,.95));
      transition: transform .09s ease, opacity .25s ease;
      box-shadow: 0 0 12px rgba(103,232,249,.12);
    }

    .equalizer.is-playing span {
      opacity: .95;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.055);
      font-size: .71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .status-pill.live {
      color: #d8fff0;
      border-color: rgba(94,230,168,.2);
      background: rgba(94,230,168,.09);
    }

    .status-pill.error {
      color: #ffe0e3;
      border-color: rgba(255,125,135,.25);
      background: rgba(255,125,135,.10);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .control-btn {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text);
      background: rgba(255,255,255,.07);
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
    }

    .control-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.12);
      border-color: var(--border-strong);
    }

    .control-btn:active {
      transform: scale(.96);
    }

    .control-btn.primary {
      width: 72px;
      height: 72px;
      border: 0;
      color: #04171c;
      background:
        linear-gradient(145deg, rgba(255,255,255,.98), rgba(197,246,250,.92));
      box-shadow:
        0 10px 30px rgba(87,218,228,.18),
        inset 0 1px 0 rgba(255,255,255,.75);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .control-btn.primary svg {
      width: 30px;
      height: 30px;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 0;
      max-width: 360px;
      color: var(--muted);
    }

    .volume-row svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex: 0 0 auto;
    }

    #volumeSlider {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .stations-section {
      margin-top: 22px;
      padding: 24px;
      border-radius: 30px;
      background: rgba(7, 25, 31, .38);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(24px) saturate(135%);
      -webkit-backdrop-filter: blur(24px) saturate(135%);
      box-shadow: 0 22px 65px rgba(0,0,0,.23);
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding: 0 2px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .station-count {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
    }

    .stations {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
    }

    .station-card {
      position: relative;
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 22px;
      background: rgba(255,255,255,.045);
      padding: 10px 10px 12px;
      text-align: left;
      cursor: pointer;
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .station-card:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.075);
      border-color: rgba(255,255,255,.09);
    }

    .station-card.active {
      background:
        linear-gradient(180deg, rgba(103,232,249,.12), rgba(255,255,255,.06));
      border-color: rgba(137,240,247,.42);
      box-shadow:
        0 12px 30px rgba(0,0,0,.20),
        0 0 0 1px rgba(103,232,249,.06) inset;
    }

    .station-card:active {
      transform: scale(.98);
    }

    .station-art {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 17px;
      background: rgba(255,255,255,.05);
      box-shadow: 0 8px 20px rgba(0,0,0,.20);
    }

    .station-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .station-play-indicator {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #06181d;
      background: rgba(255,255,255,.88);
      box-shadow: 0 5px 14px rgba(0,0,0,.25);
      opacity: 0;
      transform: scale(.84);
      transition: opacity .18s ease, transform .18s ease;
    }

    .station-card:hover .station-play-indicator,
    .station-card.active .station-play-indicator {
      opacity: 1;
      transform: scale(1);
    }

    .station-play-indicator svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .station-card.playing .station-play-indicator {
      background: #dffff1;
    }

    .station-name {
      display: block;
      margin-top: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .station-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 18px;
      margin-top: 3px;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 600;
    }

    .tiny-live {
      display: none;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(94,230,168,.09);
    }

    .station-card.playing .tiny-live {
      display: inline-block;
    }

    .footer-note {
      padding: 18px 6px 4px;
      text-align: center;
      color: rgba(235,247,250,.38);
      font-size: .7rem;
    }

    @media (max-width: 920px) {
      .player-card {
        grid-template-columns: minmax(220px, 270px) 1fr;
        gap: 30px;
      }

      .stations {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      body {
        padding:
          calc(env(safe-area-inset-top) + 12px)
          calc(env(safe-area-inset-right) + 12px)
          calc(env(safe-area-inset-bottom) + 22px)
          calc(env(safe-area-inset-left) + 12px);
      }

      .topbar {
        padding: 6px 4px 14px;
      }

      .brand-subtitle {
        display: none;
      }

      .install-btn {
        width: 44px;
        height: 44px;
        justify-content: center;
        padding: 0;
      }

      .install-btn span {
        display: none;
      }

      .player-card {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 21px;
        border-radius: 29px;
      }

      .cover-wrap {
        width: min(72vw, 310px);
      }

      .player-panel {
        text-align: center;
      }

      .eyebrow,
      .controls,
      .equalizer-wrap {
        justify-content: center;
      }

      #nowPlayingText {
        font-size: clamp(2rem, 10vw, 3.15rem);
      }

      .equalizer-wrap {
        margin: 20px 0 18px;
        flex-wrap: wrap;
      }

      .equalizer {
        width: 100%;
        height: 50px;
      }

      .volume-row {
        margin: 20px auto 0;
      }

      .stations-section {
        margin-top: 14px;
        padding: 16px 12px 14px;
        border-radius: 26px;
      }

      .stations {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }

      .station-card {
        border-radius: 18px;
        padding: 7px 7px 9px;
      }

      .station-art {
        border-radius: 14px;
      }

      .station-play-indicator {
        width: 29px;
        height: 29px;
        right: 6px;
        bottom: 6px;
      }

      .station-name {
        font-size: .72rem;
        margin-top: 7px;
      }

      .station-meta {
        font-size: .61rem;
      }

      .control-btn {
        width: 52px;
        height: 52px;
      }

      .control-btn.primary {
        width: 70px;
        height: 70px;
      }
    }

    @media (max-width: 380px) {
      .stations {
        gap: 7px;
      }

      .station-card {
        padding: 6px;
      }

      .station-name {
        font-size: .68rem;
      }
    }

    /* Echo Show / wide landscape */
    @media (min-width: 900px) and (max-height: 720px) and (orientation: landscape) {
      body {
        padding-top: calc(env(safe-area-inset-top) + 10px);
        padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
      }

      .topbar {
        padding-bottom: 10px;
      }

      .brand-name {
        font-size: 2.15rem;
      }

      .player-card {
        grid-template-columns: 230px 1fr;
        padding: 22px 30px;
        gap: 34px;
      }

      .cover-wrap {
        width: 220px;
      }

      #nowPlayingText {
        font-size: clamp(2rem, 4.7vw, 3.4rem);
      }

      .equalizer-wrap {
        margin: 17px 0 15px;
      }

      .equalizer {
        height: 44px;
      }

      .volume-row {
        margin-top: 14px;
      }

      .control-btn {
        width: 48px;
        height: 48px;
      }

      .control-btn.primary {
        width: 62px;
        height: 62px;
      }

      .stations-section {
        margin-top: 12px;
        padding: 14px 18px;
      }

      .section-header {
        margin-bottom: 10px;
      }

      .stations {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }

      .station-card {
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr);
        grid-template-rows: auto auto;
        column-gap: 9px;
        align-items: center;
        padding: 7px;
        border-radius: 15px;
      }

      .station-art {
        grid-row: 1 / span 2;
        width: 50px;
        border-radius: 11px;
      }

      .station-name {
        margin-top: 0;
        font-size: .7rem;
      }

      .station-meta {
        font-size: .58rem;
      }

      .station-play-indicator {
        display: none;
      }

      .footer-note {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .station-card,
      .control-btn {
        transition: none;
      }
    }

    @supports not ((backdrop-filter: blur(20px)) or (-webkit-backdrop-filter: blur(20px))) {
      .glass,
      .stations-section,
      .install-btn {
        background: rgba(6, 26, 32, .94);
      }
    }
  

    /* ==========================================================
       ZERO-SCROLL LAYOUT
       - Mobile: one-screen 3D flip between player and all stations.
       - Tablet / Echo / wide screens: player above, every station below.
       ========================================================== */

    body {
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .app-shell {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      flex: 0 0 auto;
    }

    .content-stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-card,
    .stations-section {
      min-height: 0;
    }

    .player-card {
      flex: 0 0 min(39%, 350px);
    }

    .stations-section {
      flex: 1 1 auto;
      margin-top: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      flex: 0 0 auto;
    }

    .stations {
      flex: 1 1 auto;
      min-height: 0;
      grid-auto-rows: minmax(0, 1fr);
    }

    .footer-note {
      display: none;
    }

    .mobile-flip-button,
    .mobile-back-button {
      display: none;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Tablet / Echo station cards are intentionally compact so all 12
       are visible at the same time without vertical scrolling. */
    @media (min-width: 681px) {
      .stations {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

    .theme-badge {
      color: rgba(255,255,255,.84);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .station-card {
      position: relative;
    }

    .favorite-toggle {
      position: absolute;
      z-index: 4;
      top: 8px;
      left: 8px;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      color: rgba(255,255,255,.82);
      background: rgba(4,18,23,.58);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 14px;
      line-height: 1;
      opacity: .78;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }

    .favorite-toggle:hover {
      transform: scale(1.08);
      opacity: 1;
    }

    .favorite-toggle.is-favorite {
      color: #fff;
      background: rgba(238,76,112,.76);
      border-color: rgba(255,255,255,.2);
      opacity: 1;
    }

    .alaina-toast {
      position: fixed;
      z-index: 1200;
      top: calc(env(safe-area-inset-top) + 64px);
      left: 50%;
      max-width: min(520px, calc(100vw - 28px));
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 10px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      color: rgba(255,255,255,.94);
      background: rgba(5,24,29,.72);
      box-shadow: 0 14px 44px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.09);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      transform: translate(-50%, -14px) scale(.96);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .28s cubic-bezier(.2,.75,.2,1);
      font-size: .76rem;
      font-weight: 600;
      text-align: left;
    }

    .alaina-toast.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .alaina-toast-mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: #051a20;
      background: rgba(221,252,255,.94);
      font-weight: 800;

    .feature-overlay {

      z-index: 1100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))

      background: rgba(0,10,14,.44);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

    .feature-overlay[hidden] {

    .feature-sheet {

      height: min(500px, calc(100dvh - 20px));

      overflow: hidden;
      border-radius: 30px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      background: rgba(8,30,36,.76);

    .feature-header {

      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

      font-size: .58rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    #featureTitle {
      font-size: 1.25rem;
      line-height: 1.05;
      letter-spacing: -.025em;
    }

    .feature-nav-button,
    .feature-close-button {

      height: 36px;

      place-items: center;

      background: rgba(255,255,255,.07);

    .feature-nav-button {
      font-size: 1.55rem;
      line-height: 1;
    }

    .feature-close-button {
      font-size: 1.45rem;
      line-height: 1;
    }

    .hub-home,

      flex: 1 1 auto;

    }

      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));

    .hub-tile {

    .feature-primary {

    .feature-secondary {

    .feature-button {

    .feature-button.primary {

    .mini-station-grid {

      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .mini-station {

    .news-card {

      margin: auto;
      min-height: 0;

      background: rgba(255,255,255,.05);
      text-align: left;
    }

    .news-counter {

      text-transform: uppercase;
      margin-bottom: 8px;

    .news-headline {

      letter-spacing: -.03em;
      font-weight: 760;
    }

    .news-meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: .62rem;
    }

    .sleep-grid {
      width: min(100%, 470px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 9px;
    }

    .sleep-option {
      min-height: 58px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      color: white;
      background: rgba(255,255,255,.055);
      cursor: pointer;
      font-weight: 750;
    }

    .seasonal-decor {
      position: fixed;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .seasonal-mark {
      position: absolute;
      color: rgba(255,255,255,.12);
      font-size: clamp(26px, 5vw, 72px);
      filter: drop-shadow(0 0 22px rgba(255,255,255,.05));
      animation: seasonalFloat 18s ease-in-out infinite alternate;
    }

    .seasonal-mark:nth-child(1) { left: 4%; top: 16%; }
    .seasonal-mark:nth-child(2) { right: 7%; top: 10%; animation-delay: -3s; }
    .seasonal-mark:nth-child(3) { left: 18%; bottom: 8%; animation-delay: -5s; }
    .seasonal-mark:nth-child(4) { right: 22%; bottom: 13%; animation-delay: -8s; }
    .seasonal-mark:nth-child(5) { left: 48%; top: 6%; animation-delay: -11s; }
    .seasonal-mark:nth-child(6) { right: 43%; bottom: 4%; animation-delay: -14s; }

    @keyframes seasonalFloat {
      from { transform: translate3d(0,0,0) rotate(-4deg); opacity: .55; }
      to { transform: translate3d(0,-18px,0) rotate(5deg); opacity: 1; }
    }

    .background-toggle-track {

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <script>
    const audio = document.getElementById("radioPlayer");
    const stations = Array.from(document.querySelectorAll(".station-card"));
    const playPauseButton = document.getElementById("playPauseButton");
    const playPauseIcon = document.getElementById("playPauseIcon");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const coverArt = document.getElementById("coverArt");
    const nowPlayingText = document.getElementById("nowPlayingText");
    const stationRegion = document.getElementById("stationRegion");
    const statusPill = document.getElementById("statusPill");
    const equalizer = document.getElementById("equalizer");
    const eqBars = Array.from(equalizer.querySelectorAll("span"));
    const playerCard = document.getElementById("playerCard");
    const volumeSlider = document.getElementById("volumeSlider");
    const installButton = document.getElementById("installButton");
    const contentStage = document.getElementById("contentStage");
    const showStationsButton = document.getElementById("showStationsButton");
    const backToPlayerButton = document.getElementById("backToPlayerButton");

    const PLAY_ICON = '<path d="M8 5v14l11-7L8 5Z"/>';
    const PAUSE_ICON = '<path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/>';

    let currentStationIndex = -1;
    let hls = null;
    let deferredPrompt = null;
    let equalizerTimer = null;
    let equalizerLevels = eqBars.map(() => 0.12);

    const flagMap = {
      BAH: "🇧🇭",
      UAE: "🇦🇪",
      IND: "🇮🇳",
      SL: "🇱🇰"
    };

    function isMobileFlipLayout() {
      return window.matchMedia("(max-width: 680px)").matches;
    }

    function setMobileFace(showStations) {
      if (!contentStage) return;
      contentStage.classList.toggle("flipped", Boolean(showStations) && isMobileFlipLayout());
    }

    showStationsButton?.addEventListener("click", () => setMobileFace(true));
    backToPlayerButton?.addEventListener("click", () => setMobileFace(false));

    window.addEventListener("resize", () => {
      if (!isMobileFlipLayout()) setMobileFace(false);
    });

    function setStatus(text, mode = "") {
      statusPill.textContent = text;
      statusPill.className = "status-pill";
      if (mode) statusPill.classList.add(mode);
    }

    function setPlayVisual(playing) {
      playPauseIcon.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
      playPauseButton.setAttribute("aria-label", playing ? "Pause" : "Play");
      playerCard.classList.toggle("is-playing", playing);
      equalizer.classList.toggle("is-playing", playing);

      stations.forEach((station, index) => {
        station.classList.toggle("playing", playing && index === currentStationIndex);
      });

      if (playing) {
        startEqualizer();
      } else {
        stopEqualizer();
      }

      if ("mediaSession" in navigator) {
        try {
          navigator.mediaSession.playbackState = playing ? "playing" : "paused";
        } catch (_) {}
      }
    }

    function startEqualizer() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (equalizerTimer) return;

      const tick = () => {
        const center = (eqBars.length - 1) / 2;

        eqBars.forEach((bar, index) => {
          const centerBoost = 1 - Math.abs(index - center) / center;
          const target = 0.17 + Math.random() * (0.50 + centerBoost * 0.28);
          equalizerLevels[index] = equalizerLevels[index] * 0.42 + target * 0.58;
          bar.style.transform = `scaleY(${Math.min(1, equalizerLevels[index]).toFixed(3)})`;
        });
      };

      tick();
      equalizerTimer = window.setInterval(tick, 105);
    }

    function stopEqualizer() {
      if (equalizerTimer) {
        clearInterval(equalizerTimer);
        equalizerTimer = null;
      }

      eqBars.forEach((bar, index) => {
        equalizerLevels[index] = 0.12;
        bar.style.transform = "scaleY(.12)";
      });
    }

    function destroyHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    function updateMediaSession(card) {
      if (!("mediaSession" in navigator)) return;

      const stationName = card.dataset.name;
      const regionName = card.dataset.regionName || "Live Radio";
      const art = new URL(card.dataset.art, window.location.href).href;

      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: stationName,
          artist: `${regionName} · Alaina Live`,
          album: "Live Radio",
          artwork: [{ src: art }]
        });
      } catch (_) {}
    }

    function updateSelectedStation(index) {
      if (index < 0 || index >= stations.length) return;

      currentStationIndex = index;
      const card = stations[index];

      stations.forEach((station, i) => {
        station.classList.toggle("active", i === index);
      });

      const flag = flagMap[card.dataset.region] || "";
      nowPlayingText.textContent = card.dataset.name;
      stationRegion.textContent = `${flag} ${card.dataset.regionName || "Live Radio"}`.trim();
      coverArt.src = card.dataset.art;
      coverArt.alt = `${card.dataset.name} artwork`;
      document.title = `${card.dataset.name} | Alaina Live`;

      localStorage.setItem("alainaLastStation", String(index));
      updateMediaSession(card);
    }

    async function playCurrentStation() {
      if (currentStationIndex < 0) {
        const saved = Number(localStorage.getItem("alainaLastStation"));
        const index = Number.isInteger(saved) && saved >= 0 && saved < stations.length ? saved : 0;
        updateSelectedStation(index);
      }

      const card = stations[currentStationIndex];
      const streamUrl = card.dataset.src;

      destroyHls();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();

      setStatus("Connecting");
      setPlayVisual(false);

      try {
        if (/\.m3u8(?:$|\?)/i.test(streamUrl)) {
          if (window.Hls && Hls.isSupported()) {
            hls = new Hls({
              enableWorker: true,
              lowLatencyMode: false,
              backBufferLength: 30
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(audio);

            hls.on(Hls.Events.MANIFEST_PARSED, async () => {
              try {
                await audio.play();
              } catch (error) {
                console.warn("Playback needs a user gesture:", error);
                setStatus("Tap Play");
              }
            });

            hls.on(Hls.Events.ERROR, (_, data) => {
              if (data && data.fatal) {
                setStatus("Unavailable", "error");
                setPlayVisual(false);
              }
            });
          } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
            audio.src = streamUrl;
            await audio.play();
          } else {
            setStatus("Unsupported", "error");
            return;
          }
        } else {
          audio.src = streamUrl;
          await audio.play();
        }
      } catch (error) {
        console.error("Station playback failed:", error);
        setStatus("Unavailable", "error");
        setPlayVisual(false);
      }
    }

    async function selectAndPlay(index) {
      const sameStation = index === currentStationIndex;

      if (sameStation && !audio.paused && !audio.ended) {
        audio.pause();
        return;
      }

      updateSelectedStation(index);

      if (sameStation && audio.src && audio.paused && !hls) {
        try {
          await audio.play();
          return;
        } catch (_) {
          // Fall back to a clean reload below.
        }
      }

      await playCurrentStation();
    }

    function changeStation(direction) {
      let nextIndex;

      if (currentStationIndex < 0) {
        nextIndex = direction < 0 ? stations.length - 1 : 0;
      } else {
        nextIndex = (currentStationIndex + direction + stations.length) % stations.length;
      }

      updateSelectedStation(nextIndex);
      playCurrentStation();
    }

    stations.forEach((card, index) => {
      card.addEventListener("click", async () => {
        await selectAndPlay(index);
        if (isMobileFlipLayout()) {
          window.setTimeout(() => setMobileFace(false), 110);
        }
      });
    });

    prevButton.addEventListener("click", () => changeStation(-1));
    nextButton.addEventListener("click", () => changeStation(1));

    playPauseButton.addEventListener("click", async () => {
      if (currentStationIndex < 0) {
        await playCurrentStation();
        return;
      }

      if (!audio.paused) {
        audio.pause();
        return;
      }

      if (audio.src || hls) {
        try {
          await audio.play();
        } catch (_) {
          await playCurrentStation();
        }
      } else {
        await playCurrentStation();
      }
    });

    volumeSlider.addEventListener("input", () => {
      audio.volume = Number(volumeSlider.value);
      localStorage.setItem("alainaVolume", volumeSlider.value);
    });

    audio.addEventListener("playing", () => {
      setStatus("Live", "live");
      setPlayVisual(true);
    });

    audio.addEventListener("waiting", () => {
      setStatus("Buffering");
    });

    audio.addEventListener("stalled", () => {
      setStatus("Reconnecting");
    });

    audio.addEventListener("pause", () => {
      if (currentStationIndex >= 0 && !audio.ended) {
        setStatus("Paused");
      }
      setPlayVisual(false);
    });

    audio.addEventListener("error", () => {
      setStatus("Unavailable", "error");
      setPlayVisual(false);
    });

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.classList.add("visible");
    });

    installButton.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      installButton.classList.remove("visible");
      deferredPrompt.prompt();

      try {
        await deferredPrompt.userChoice;
      } finally {
        deferredPrompt = null;
      }
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installButton.classList.remove("visible");
    });

    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.setActionHandler("play", async () => {
          if (currentStationIndex < 0 || (!audio.src && !hls)) {
            await playCurrentStation();
          } else {
            await audio.play();
          }
        });

        navigator.mediaSession.setActionHandler("pause", () => audio.pause());
        navigator.mediaSession.setActionHandler("previoustrack", () => changeStation(-1));
        navigator.mediaSession.setActionHandler("nexttrack", () => changeStation(1));
      } catch (_) {}
    }

    const savedVolume = Number(localStorage.getItem("alainaVolume"));
    if (Number.isFinite(savedVolume) && savedVolume >= 0 && savedVolume <= 1) {
      audio.volume = savedVolume;
      volumeSlider.value = String(savedVolume);
    }

    const savedStation = Number(localStorage.getItem("alainaLastStation"));
    if (Number.isInteger(savedStation) && savedStation >= 0 && savedStation < stations.length) {
      updateSelectedStation(savedStation);
      setStatus("Ready");
    }

    if ("serviceWorker" in navigator &&
        (location.hostname === "naps73r.github.io" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .catch(error => console.warn("Service worker registration failed:", error));
      });
    }
  </script>

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeHttpUrl(value) {
      try {
        const u = new URL(value, window.location.href);
        return /^https?:$/.test(u.protocol) ? u.href : "";
      } catch (_) {
        return "";
      }
    }

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function showAlaina(message, duration = 3200) {
      clearTimeout(toastTimer);
      alainaToastText.textContent = message;
      alainaToast.classList.add("visible");
      toastTimer = setTimeout(() => alainaToast.classList.remove("visible"), duration);

    function greetingMessage() {
      const hour = Number(new Intl.DateTimeFormat("en-US", {

      }).format(new Date()));

      if (hour >= 5 && hour < 11) return "Good morning ☀️ Coffee + radio?";
      if (hour >= 11 && hour < 17) return "Good afternoon 👋 Need some music?";
      if (hour >= 17 && hour < 23) return "Good evening 🌙 Time to unwind.";
      return "Still awake? 👀 Alaina Live is too.";
    }

    function openHub(feature = null) {
      featureOverlay.hidden = false;
      document.body.classList.add("feature-open");

      document.body.classList.remove("feature-open");

    function showHubHome() {
      featureTitle.textContent = "Extras";

      featureContent.hidden = true;
      featureContent.innerHTML = "";

    function showFeatureShell(title) {
      featureTitle.textContent = title;

      featureContent.hidden = false;

    hubButton.addEventListener("click", () => openHub());
    featureCloseButton.addEventListener("click", closeHub);

    async function fetchWeather() {
      const cachedRaw = localStorage.getItem("alainaWeather");
      if (cachedRaw) {
        try {
          const cached = JSON.parse(cachedRaw);
          if (Date.now() - cached.savedAt < 15 * 60 * 1000 && cached.data) {
            weatherData = cached.data;
            updateWeatherChip();
          }
        } catch (_) {}
      }

      try {
        const response = await fetch(WEATHER_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("Weather HTTP " + response.status);
        weatherData = await response.json();
        localStorage.setItem("alainaWeather", JSON.stringify({
          savedAt: Date.now(),
          data: weatherData
        }));
        updateWeatherChip();
      } catch (error) {
        console.warn("Weather unavailable:", error);
      }
    }

    function updateWeatherChip() {
      if (!weatherData?.current) return;
      const code = WEATHER_CODES[weatherData.current.weather_code] || ["🌤️", "Weather"];
      weatherChipIcon.textContent = code[0];
      weatherChipTemp.textContent = `${Math.round(weatherData.current.temperature_2m)}°`;
      weatherChip.title = `${code[1]} in Bahrain`;
    }

    weatherChip.addEventListener("click", () => openHub("weather"));

    function renderWeather() {
      showFeatureShell("Bahrain Weather");

      if (!weatherData?.current) {
        featureContent.innerHTML = `
          <div class="feature-center">
            <div class="feature-big-icon">🌤️</div>
            <div class="feature-primary">Loading weather…</div>
            <div class="feature-secondary">Fetching the latest Bahrain conditions.</div>
          </div>`;
        fetchWeather().then(() => {
          if (!featureOverlay.hidden && featureTitle.textContent === "Bahrain Weather") renderWeather();
        });
        return;
      }

      const c = weatherData.current;
      const daily = weatherData.daily || {};
      const code = WEATHER_CODES[c.weather_code] || ["🌤️", "Current weather"];
      const high = daily.temperature_2m_max?.[0];
      const low = daily.temperature_2m_min?.[0];

      featureContent.innerHTML = `
        <div class="feature-center">
          <div class="feature-big-icon">${code[0]}</div>
          <div class="feature-primary">${Math.round(c.temperature_2m)}°C</div>
          <div class="feature-secondary">
            ${escapeHtml(code[1])} · Feels like ${Math.round(c.apparent_temperature)}°C<br>
            Humidity ${Math.round(c.relative_humidity_2m)}% · Wind ${Math.round(c.wind_speed_10m)} km/h
            ${Number.isFinite(high) ? `<br>Today ${Math.round(high)}° / ${Math.round(low)}°` : ""}
          </div>
          <div class="feature-attribution">Manama, Bahrain · Weather data: Open-Meteo</div>
        </div>`;
    }

    async function loadNews() {
      // Prefer the local file generated by the included GitHub Action.
      try {
        const response = await fetch(`news.json?v=${Date.now()}`, { cache: "no-store" });
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data.items) && data.items.length) {
            newsItems = data.items.slice(0, 10);
            return newsItems;
          }
        }
      } catch (_) {}

      // If BNA permits browser CORS, this works even before the Action runs.
      try {
        const response = await fetch("https://api.bna.bh/rss/local-news", { cache: "no-store" });
        if (!response.ok) throw new Error("BNA RSS " + response.status);
        const xmlText = await response.text();
        const xml = new DOMParser().parseFromString(xmlText, "application/xml");
        newsItems = Array.from(xml.querySelectorAll("item")).slice(0, 10).map(item => ({
          title: item.querySelector("title")?.textContent?.trim() || "Bahrain News",
          link: item.querySelector("link")?.textContent?.trim() || "",
          published: item.querySelector("pubDate")?.textContent?.trim() || ""
        }));
      } catch (error) {
        console.warn("News feed unavailable:", error);
      }

      return newsItems;
    }

    async function renderNews(reset = false) {
      showFeatureShell("Bahrain Now");

      if (reset) newsIndex = 0;

      if (!newsItems.length) {
        featureContent.innerHTML = `
          <div class="feature-center">
            <div class="feature-big-icon">📰</div>
            <div class="feature-primary">Loading headlines…</div>
            <div class="feature-secondary">Bahrain News Agency</div>
          </div>`;

      if (!newsItems.length) {
        featureContent.innerHTML = `
          <div class="feature-center">
            <div class="feature-big-icon">📰</div>
            <div class="feature-primary">Headlines are waking up.</div>

      document.getElementById("newsPrev")?.addEventListener("click", () => {
        newsIndex--;
        renderNews();
      });
      document.getElementById("newsNext")?.addEventListener("click", () => {
        newsIndex++;

    function stopSleepTimer(showMessage = true) {
      if (sleepTimer) clearTimeout(sleepTimer);
      if (sleepTicker) clearInterval(sleepTicker);
      sleepTimer = null;
      sleepTicker = null;
      sleepDeadline = null;
      localStorage.removeItem("alainaSleepDeadline");
      if (showMessage) showAlaina("Sleep timer cancelled. Party continues 🎶");
    }

    function sleepRemainingText() {
      if (!sleepDeadline) return "Off";
      const ms = Math.max(0, sleepDeadline - Date.now());
      const minutes = Math.ceil(ms / 60000);
      return `${minutes} min remaining`;
    }

    function startSleepTimer(minutes) {
      stopSleepTimer(false);
      const ms = minutes * 60 * 1000;
      sleepDeadline = Date.now() + ms;
      localStorage.setItem("alainaSleepDeadline", String(sleepDeadline));

      sleepTimer = setTimeout(() => fadeOutAndPause(), ms);
      sleepTicker = setInterval(() => {
        if (!sleepDeadline || Date.now() >= sleepDeadline) {
          if (sleepTicker) clearInterval(sleepTicker);
          sleepTicker = null;
        }
      }, 30000);

      showAlaina(`Sleep timer set for ${minutes} minutes 😴`);
      renderSleep();
    }

    function startEndOfHourSleep() {
      const now = new Date();
      const next = new Date(now);
      next.setMinutes(60, 0, 0);
      const minutes = Math.max(1, Math.ceil((next - now) / 60000));
      startSleepTimer(minutes);
    }

    function fadeOutAndPause() {
      const originalVolume = audio.volume;
      let step = 0;
      const totalSteps = 16;
      const interval = setInterval(() => {
        step++;
        audio.volume = Math.max(0, originalVolume * (1 - step / totalSteps));
        if (step >= totalSteps) {
          clearInterval(interval);
          audio.pause();
          setTimeout(() => {
            audio.volume = Number(volumeSlider.value);
          }, 300);
          stopSleepTimer(false);
          showAlaina("Good night 🌙 Alaina has faded the radio out.");
        }
      }, 500);
    }

    function renderSleep() {
      showFeatureShell("Sleep Timer");
      featureContent.innerHTML = `
        <div class="feature-center">
          <div class="feature-big-icon">😴</div>
          <div class="feature-primary">${sleepDeadline ? escapeHtml(sleepRemainingText()) : "Choose a timer"}</div>
          <div class="sleep-grid">
            <button class="sleep-option" data-sleep="15" type="button">15 min</button>
            <button class="sleep-option" data-sleep="30" type="button">30 min</button>
            <button class="sleep-option" data-sleep="45" type="button">45 min</button>
            <button class="sleep-option" data-sleep="60" type="button">60 min</button>
            <button class="sleep-option" data-sleep="hour" type="button">End of hour</button>
            <button class="sleep-option" data-sleep="off" type="button">${sleepDeadline ? "Turn off" : "Off"}</button>
          </div>
        </div>`;

      featureContent.querySelectorAll("[data-sleep]").forEach(button => {
        button.addEventListener("click", () => {
          const value = button.dataset.sleep;
          if (value === "off") {
            stopSleepTimer();
            renderSleep();
          } else if (value === "hour") {
            startEndOfHourSleep();
          } else {
            startSleepTimer(Number(value));
          }
        });
      });
    }

    function getFavoriteIndexes() {
      try {
        const values = JSON.parse(localStorage.getItem("alainaFavorites") || "[]");
        return Array.isArray(values) ? values.filter(Number.isInteger) : [];
      } catch (_) {
        return [];
      }
    }

    function setFavoriteIndexes(values) {
      const unique = [...new Set(values)].filter(i => i >= 0 && i < stations.length);
      localStorage.setItem("alainaFavorites", JSON.stringify(unique));
      syncFavoriteButtons();
    }

    function toggleFavorite(index) {
      const values = getFavoriteIndexes();
      const at = values.indexOf(index);
      if (at >= 0) {
        values.splice(at, 1);
        showAlaina(`${stations[index].dataset.name} removed from favorites.`);
      } else {
        values.push(index);
        showAlaina(`♥ ${stations[index].dataset.name} saved.`);
      }
      setFavoriteIndexes(values);
    }

    function syncFavoriteButtons() {
      const favorites = new Set(getFavoriteIndexes());
      stations.forEach((card, index) => {
        const heart = card.querySelector(".favorite-toggle");
        if (!heart) return;
        const active = favorites.has(index);
        heart.classList.toggle("is-favorite", active);
        heart.textContent = active ? "♥" : "♡";
        heart.setAttribute("aria-label", active ? "Remove from favorites" : "Add to favorites");
      });
    }

    stations.forEach((card, index) => {
      const heart = document.createElement("span");
      heart.className = "favorite-toggle";
      heart.setAttribute("role", "button");
      heart.setAttribute("tabindex", "0");
      heart.textContent = "♡";
      heart.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        toggleFavorite(index);
      });
      heart.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          event.stopPropagation();
          toggleFavorite(index);
        }
      });
      card.appendChild(heart);
    });
    syncFavoriteButtons();

    function getRecentIndexes() {
      try {
        const values = JSON.parse(localStorage.getItem("alainaRecent") || "[]");
        return Array.isArray(values) ? values.filter(Number.isInteger) : [];
      } catch (_) {
        return [];
      }
    }

    function recordRecent(index) {
      if (!Number.isInteger(index) || index < 0 || index >= stations.length) return;
      let values = getRecentIndexes().filter(i => i !== index);
      values.unshift(index);
      values = values.slice(0, 6);
      localStorage.setItem("alainaRecent", JSON.stringify(values));
    }

    function renderStationCollection(title, indexes, emptyText) {
      showFeatureShell(title);

      if (!indexes.length) {
        featureContent.innerHTML = `
          <div class="feature-center">
            <div class="feature-big-icon">${title === "Favorites" ? "♡" : "↺"}</div>
            <div class="feature-primary">${escapeHtml(emptyText)}</div>
            <div class="feature-secondary">Your choices stay on this device.</div>
          </div>`;
        return;
      }

      const cards = indexes.map(index => {
        const card = stations[index];
        return `
          <button class="mini-station" type="button" data-mini-index="${index}">
            <img src="${escapeHtml(card.dataset.art)}" alt="">
            <span>${escapeHtml(card.dataset.name)}</span>
          </button>`;
      }).join("");

      featureContent.innerHTML = `<div class="mini-station-grid">${cards}</div>`;
      featureContent.querySelectorAll("[data-mini-index]").forEach(button => {
        button.addEventListener("click", async () => {
          const index = Number(button.dataset.miniIndex);
          closeHub();
          await selectAndPlay(index);
          recordRecent(index);
          if (isMobileFlipLayout()) setMobileFace(false);
        });
      });
    }

    function renderFavorites() {
      renderStationCollection("Favorites", getFavoriteIndexes(), "No favorites yet");
    }

    function renderRecent() {
      renderStationCollection("Recently Played", getRecentIndexes(), "Nothing played yet");
    }

    function startRoulette() {
      showFeatureShell("Radio Roulette");
      featureContent.innerHTML = `
        <div class="feature-center">
          <div class="feature-big-icon">🎲</div>
          <div id="rouletteName" class="feature-primary">Spinning…</div>
          <div class="feature-secondary">Alaina is making an important musical decision.</div>
        </div>`;

      const name = document.getElementById("rouletteName");
      let hops = 0;
      const target = Math.floor(Math.random() * stations.length);

      const timer = setInterval(() => {
        const preview = Math.floor(Math.random() * stations.length);
        name.textContent = stations[preview].dataset.name;
        hops++;

        if (hops >= 11) {
          clearInterval(timer);
          name.textContent = stations[target].dataset.name;
          setTimeout(async () => {
            closeHub();
            showAlaina(`🎲 Radio Roulette picked ${stations[target].dataset.name}!`);
            await selectAndPlay(target);
            recordRecent(target);
            if (isMobileFlipLayout()) setMobileFace(false);
          }, 450);
        }
      }, 95);
    }

    async function loadOnThisDay() {
      const nowParts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Bahrain",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const month = nowParts.find(p => p.type === "month")?.value;
      const day = nowParts.find(p => p.type === "day")?.value;
      const url = `https://en.wikipedia.org/api/rest_v1/feed/onthisday/selected/${month}/${day}`;

      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("Wikipedia HTTP " + response.status);
        const data = await response.json();
        historyItems = Array.isArray(data.selected) ? data.selected : [];
      } catch (error) {
        console.warn("On This Day unavailable:", error);
        historyItems = [];
      }
    }

    async function renderToday(reset = false) {
      showFeatureShell("On This Day");
      if (reset) historyIndex = 0;

      if (!historyItems.length) {
        featureContent.innerHTML = `
          <div class="feature-center">
            <div class="feature-big-icon">📅</div>
            <div class="feature-primary">Opening the history book…</div>
          </div>`;
        await loadOnThisDay();
      }

      if (!historyItems.length) {
        featureContent.innerHTML = `
          <div class="feature-center">
            <div class="feature-big-icon">📅</div>
            <div class="feature-primary">History is being shy today.</div>
            <div class="feature-secondary">The Wikimedia “On this day” feed is temporarily unavailable.</div>
          </div>`;
        return;
      }

      historyIndex = (historyIndex + historyItems.length) % historyItems.length;
      const item = historyItems[historyIndex];
      featureContent.innerHTML = `
        <div class="feature-center">
          <div class="feature-big-icon">📅</div>
          <div class="feature-primary">${escapeHtml(item.year || "Today")}</div>
          <div class="feature-secondary" style="font-size:clamp(.8rem,2.3vw,1.06rem);color:white;">
            ${escapeHtml(item.text || "A notable event happened on this day.")}
          </div>
          <div class="feature-buttons">
            <button id="todayPrev" class="feature-button" type="button">‹ Previous</button>
            <button id="todayNext" class="feature-button primary" type="button">Another ›</button>
          </div>
          <div class="feature-attribution">Source: Wikipedia / Wikimedia</div>
        </div>`;

      document.getElementById("todayPrev")?.addEventListener("click", () => {
        historyIndex--;
        renderToday();
      });
      document.getElementById("todayNext")?.addEventListener("click", () => {
        historyIndex++;
        renderToday();
      });
    }

    function renderFeature(feature) {
      switch (feature) {
        case "weather": return renderWeather();
        case "news": return renderNews(true);
        case "joke": return renderJoke();
        case "sleep": return renderSleep();
        case "roulette": return startRoulette();
        case "favorites": return renderFavorites();
        case "recent": return renderRecent();
        case "today": return renderToday(true);
        default: return showHubHome();
      }
    }

    // Record normal station selections without interfering with the existing
    // station click logic.
    stations.forEach((card, index) => {
      card.addEventListener("click", event => {
        if (event.target.closest(".favorite-toggle")) return;
        recordRecent(index);

        const now = Date.now();
        switchTimes = switchTimes.filter(t => now - t < 60000);
        switchTimes.push(now);

        if (switchTimes.length >= 7) {
          showAlaina("Okay, we're definitely channel surfing 😂");
          switchTimes = [];
        } else {
          showAlaina(pick(DJ_LINES));
        }
      });
    });

    prevButton.addEventListener("click", () => {
      setTimeout(() => {
        recordRecent(currentStationIndex);
        showAlaina(pick(DJ_LINES));
      }, 40);
    });

    nextButton.addEventListener("click", () => {
      setTimeout(() => {
        recordRecent(currentStationIndex);
        showAlaina(pick(DJ_LINES));
      }, 40);
    });

    audio.addEventListener("waiting", () => {
      if (Math.random() < .42) showAlaina(pick(BUFFER_LINES), 2300);
    });

    audio.addEventListener("stalled", () => {
      if (Math.random() < .45) showAlaina("Still tuning… the signal is playing hard to get 📡", 2500);
    });

    audio.addEventListener("error", () => {
      showAlaina(pick(ERROR_LINES), 3500);
    });

    // Restore a sleep timer after a refresh, if it is still in the future.
    const savedSleep = Number(localStorage.getItem("alainaSleepDeadline"));
    if (Number.isFinite(savedSleep) && savedSleep > Date.now()) {
      sleepDeadline = savedSleep;
      sleepTimer = setTimeout(fadeOutAndPause, savedSleep - Date.now());
    } else {
      localStorage.removeItem("alainaSleepDeadline");
    }

    // ---------------------------------------------------------------
    // Seasonal wallpapers.
    // Fixed-date events repeat every year. 2026 movable Hindu festivals
    // are included below. Islamic observances are detected dynamically
    // using the browser's Umm al-Qura calendar support.
    // ---------------------------------------------------------------
    const THEME_DEFS = {
      ramadan: { label: "Ramadan", icon: "☾", marks: ["☾","✦","☾","✦","✧","☾"] },
      eid: { label: "Eid Mubarak", icon: "✦", marks: ["✦","◇","✧","✦","◇","✦"] },
      hajj: { label: "Hajj", icon: "◇", marks: ["◇","✧","◇","✦","◇","✧"] },
      muharram: { label: "Muharram", icon: "✦", marks: ["✦","·","✧","·","✦","·"] },
      onam: { label: "Onam", icon: "✿", marks: ["✿","❀","✿","❁","✿","❀"] },
      vishu: { label: "Vishu", icon: "✦", marks: ["✦","❋","✧","❋","✦","❋"] },
      christmas: { label: "Christmas", icon: "❄", marks: ["❄","✦","❄","✧","❄","✦"] },
      holi: { label: "Holi", icon: "●", marks: ["●","●","●","●","●","●"] },
      diwali: { label: "Diwali", icon: "✦", marks: ["✦","◆","✧","✦","◆","✧"] },
      bahrain: { label: "Bahrain National Day", icon: "◆", marks: ["◆","✦","◆","✧","◆","✦"] },
      india: { label: "India", icon: "✦", marks: ["✦","◆","✧","✦","◆","✧"] },
      easter: { label: "Easter", icon: "✿", marks: ["✿","✧","❀","✦","✿","✧"] }
    };

    const MOVABLE_2026 = [
      { id: "holi", start: "03-03", end: "03-04" },
      { id: "onam", start: "08-25", end: "08-27" },
      { id: "diwali", start: "11-07", end: "11-09" }
    ];

    function bahrainGregorianParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Bahrain",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);

      const get = type => parts.find(p => p.type === type)?.value;
      return {
        year: Number(get("year")),
        month: Number(get("month")),
        day: Number(get("day")),
        md: `${get("month")}-${get("day")}`
      };
    }

    function easterSunday(year) {
      // Anonymous Gregorian computus.
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return { month, day };
    }

    function getHijriParts() {
      try {
        const parts = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {
          timeZone: "Asia/Bahrain",
          month: "numeric",
          day: "numeric"
        }).formatToParts(new Date());

        const month = Number(parts.find(p => p.type === "month")?.value);
        const day = Number(parts.find(p => p.type === "day")?.value);
        return { month, day };
      } catch (_) {
        return null;
      }
    }

    function dateTheme() {
      const manual = new URLSearchParams(location.search).get("theme");
      if (manual === "off") return null;
      if (manual && THEME_DEFS[manual]) return { id: manual, ...THEME_DEFS[manual] };

      const g = bahrainGregorianParts();

      // Exact / short Gregorian occasions take priority over month-long themes.
      if (g.month === 1 && g.day === 26) {
        return { id: "india", label: "India Republic Day", icon: "✦", marks: THEME_DEFS.india.marks };
      }
      if (g.month === 8 && g.day === 15) {
        return { id: "india", label: "India Independence Day", icon: "✦", marks: THEME_DEFS.india.marks };
      }
      if (g.month === 12 && (g.day === 16 || g.day === 17)) {
        return { id: "bahrain", ...THEME_DEFS.bahrain };
      }
      if (g.month === 12 && g.day >= 24 && g.day <= 26) {
        return { id: "christmas", ...THEME_DEFS.christmas };
      }
      if (g.month === 4 && (g.day === 14 || g.day === 15)) {
        return { id: "vishu", ...THEME_DEFS.vishu };
      }

      const easter = easterSunday(g.year);
      if (g.month === easter.month && Math.abs(g.day - easter.day) <= 1) {
        return { id: "easter", ...THEME_DEFS.easter };
      }

      if (g.year === 2026) {
        for (const item of MOVABLE_2026) {
          if (g.md >= item.start && g.md <= item.end) {
            return { id: item.id, ...THEME_DEFS[item.id] };
          }
        }
      }

      const h = getHijriParts();
      if (h) {
        if (h.month === 10 && h.day >= 1 && h.day <= 3) {
          return { id: "eid", label: "Eid al-Fitr", icon: "✦", marks: THEME_DEFS.eid.marks };
        }
        if (h.month === 12 && h.day >= 10 && h.day <= 13) {
          return { id: "eid", label: "Eid al-Adha", icon: "✦", marks: THEME_DEFS.eid.marks };
        }
        if (h.month === 12 && h.day >= 8 && h.day <= 9) {
          return { id: "hajj", ...THEME_DEFS.hajj };
        }
        if (h.month === 1 && h.day >= 1 && h.day <= 10) {
          return { id: "muharram", ...THEME_DEFS.muharram };
        }
        if (h.month === 9) {
          return { id: "ramadan", ...THEME_DEFS.ramadan };
        }
      }

      return null;
    }

    function applySeasonalTheme() {
      const theme = dateTheme();
      seasonalDecor.innerHTML = "";

      if (!theme) {
        document.body.removeAttribute("data-theme");
        themeBadge.hidden = true;
        return;
      }

      document.body.dataset.theme = theme.id;
      themeBadge.hidden = false;
      themeBadgeIcon.textContent = theme.icon;
      themeBadgeText.textContent = theme.label;

      const themeColor = getComputedStyle(document.body).getPropertyValue("--accent").trim();
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta && themeColor) themeMeta.setAttribute("content", themeColor);

      (theme.marks || []).slice(0, 6).forEach(mark => {
        const span = document.createElement("span");
        span.className = "seasonal-mark";
        span.textContent = mark;
        seasonalDecor.appendChild(span);
      });

      setTimeout(() => showAlaina(`${theme.icon} ${theme.label} theme is on today.`), 1300);
    }

    // Theme test helper:
    // ?theme=ramadan / eid / hajj / muharram / onam / vishu /
    // christmas / holi / diwali / bahrain / india / easter
    applySeasonalTheme();
    fetchWeather();
    setTimeout(() => showAlaina(greetingMessage()), 900);

  })();
  </script>


  <script>
  (() => {
    "use strict";

    const toggle = document.getElementById("backgroundToggle");
    const canvas = document.getElementById("animatedBackgroundCanvas");
    if (!toggle || !canvas || !canvas.getContext) return;

    const STORAGE_KEY = "alainaAnimatedBackground";
    let ctx = null;
    let particles = [];
    let frame = null;
    let running = false;
    let width = 0;
    let height = 0;
    let lastFrame = 0;

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    }

    class Particle {
      constructor(initial = true) {
        this.reset(initial);
      }

      reset(initial = false) {
        // Keep particles distributed across the full viewport.
        // The original Alaina background respawned each particle at a
        // random Y position; spawning at the bottom caused all particles
        // to collect there after a few seconds.
        this.x = width * (Math.random() + Math.random()) / 2;
        this.y = rand(0, Math.max(1, height));
        this.r = rand(10, 25);
        this.alpha = Math.random() * Math.random() * Math.random() * Math.random();
        this.life = rand(14, 38);
        this.speedX = 0.12 + Math.random() * 0.7;
        this.speedY = 0.25 + Math.random() * 0.8;
      }

      update() {
        this.x += this.speedX * (0.35 + Math.random());
        this.y -= this.speedY * (0.35 + Math.random());
        this.life--;

        if (this.life <= 0 || this.y < -this.r * 2 || this.x > width + this.r * 2) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = Math.min(.48, Math.max(.055, this.alpha * 1.35));
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function getParticleCount() {
      let count = Math.round((width * height) / 5200);
      if (width >= 1100) count = Math.max(count, 220);
      count = Math.min(300, Math.max(90, count));
      if (reducedMotion.matches) count = Math.min(90, count);
      return count;
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.max(1, Math.round(width * dpr));
      canvas.height = Math.max(1, Math.round(height * dpr));
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      particles = Array.from({ length: getParticleCount() }, () => new Particle(true));
    }

    function render(timestamp) {
      if (!running) return;

      const target = reducedMotion.matches ? 1000 / 24 : 1000 / 60;
      if (!lastFrame || timestamp - lastFrame >= target) {
        lastFrame = timestamp;
        ctx.clearRect(0, 0, width, height);

        for (const particle of particles) {
          particle.update();
          particle.draw();
        }
      }

      frame = requestAnimationFrame(render);
    }

    function start() {
      if (running) return;
      running = true;
      resizeCanvas();
      lastFrame = 0;
      frame = requestAnimationFrame(render);
    }

    function stop() {
      running = false;
      if (frame) {
        cancelAnimationFrame(frame);
        frame = null;
      }
      if (ctx) ctx.clearRect(0, 0, width, height);
    }

    function setEnabled(enabled, persist = true) {
      const on = Boolean(enabled);

      document.body.classList.toggle("animated-background-on", on);
      toggle.setAttribute("aria-checked", String(on));
      toggle.setAttribute(
        "aria-label",
        on ? "Turn animated background off" : "Turn animated background on"
      );

      if (on) start();
      else stop();

      if (persist) localStorage.setItem(STORAGE_KEY, on ? "1" : "0");

      if (persist && typeof window.showAlaina === "function") {
        window.showAlaina(
          on ? "Original animated background on ✨" : "Seasonal wallpaper restored."
        );
      }
    }

    toggle.addEventListener("click", () => {
      setEnabled(toggle.getAttribute("aria-checked") !== "true");
    });

    window.addEventListener("resize", () => {
      if (running) resizeCanvas();
    });

    window.addEventListener("orientationchange", () => {
      if (running) setTimeout(resizeCanvas, 180);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (running && frame) {
          cancelAnimationFrame(frame);
          frame = null;
        }
      } else if (running && !frame) {
        lastFrame = 0;
        frame = requestAnimationFrame(render);
      }
    });

    reducedMotion.addEventListener?.("change", () => {
      if (running) resizeCanvas();
    });

    const saved = localStorage.getItem(STORAGE_KEY);
    setEnabled(saved === "1", false);
  })();
  </script>
