name: Update Festival Wallpapers

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "Replace existing festival wallpapers too"
        required: false
        default: false
        type: boolean
  schedule:
    # 21:15 UTC = 00:15 Bahrain time (next calendar day)
    - cron: "15 21 * * *"

permissions:
  contents: write

concurrency:
  group: festival-wallpapers
  cancel-in-progress: false

jobs:
  update-wallpapers:
    runs-on: ubuntu-latest
    env:
      FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_all || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Wikimedia Commons festival wallpaper library
        shell: python
        run: |
          import html
          import json
          import mimetypes
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://commons.wikimedia.org/w/api.php"
          OUT_DIR = Path("festival-wallpapers")
          MANIFEST = Path("festival-wallpaper.json")
          USER_AGENT = "SenaishaLive/1.0 (festival wallpaper updater; GitHub Actions)"
          FORCE = os.getenv("FORCE_REFRESH", "false").lower() == "true"

          # Search phrases deliberately favor scenery, decorations and objects
          # rather than portraits, posters or text-heavy artwork.
          THEMES = {
              "ramadan": {
                  "label": "Ramadan",
                  "query": "Ramadan lantern crescent night lights"
              },
              "eid": {
                  "label": "Eid",
                  "query": "Eid lantern mosque lights night"
              },
              "hajj": {
                  "label": "Hajj",
                  "query": "Kaaba Mecca night architecture"
              },
              "muharram": {
                  "label": "Muharram",
                  "query": "Islamic crescent moon night sky"
              },
              "onam": {
                  "label": "Onam",
                  "query": "Onam pookalam flower carpet Kerala"
              },
              "vishu": {
                  "label": "Vishu",
                  "query": "Vishukkani Kerala Vishu kani"
              },
              "christmas": {
                  "label": "Christmas",
                  "query": "Christmas lights tree night"
              },
              "holi": {
                  "label": "Holi",
                  "query": "Holi colour powder colorful"
              },
              "diwali": {
                  "label": "Diwali",
                  "query": "Diwali diyas lamps lights"
              },
              "bahrain": {
                  "label": "Bahrain National Day",
                  "query": "Bahrain flag Manama skyline"
              },
              "india": {
                  "label": "India National Day",
                  "query": "India flag India Gate New Delhi"
              },
              "easter": {
                  "label": "Easter",
                  "query": "Easter eggs spring flowers"
              }
          }

          SAFE_MIMES = {
              "image/jpeg": ".jpg",
              "image/png": ".png",
              "image/webp": ".webp"
          }

          BAD_TITLE_WORDS = {
              "poster", "logo", "banner", "advert", "advertisement",
              "screenshot", "map", "stamp", "coin", "book", "pamphlet"
          }

          def strip_html(value):
              if not value:
                  return ""
              value = re.sub(r"<[^>]+>", " ", str(value))
              value = html.unescape(value)
              return re.sub(r"\s+", " ", value).strip()

          def metadata_value(meta, key):
              item = (meta or {}).get(key) or {}
              return strip_html(item.get("value", ""))

          def license_is_safe(name):
              n = (name or "").strip().lower()
              if not n:
                  return False
              return (
                  "public domain" in n
                  or n == "cc0"
                  or n.startswith("cc0 ")
                  or n.startswith("cc by ")
                  or n.startswith("cc by-sa ")
              )

          def request_json(params, attempts=3):
              query = urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  API + "?" + query,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/json"
                  }
              )
              last = None
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(3 * (attempt + 1))
              raise last

          def search_candidates(query):
              params = {
                  "action": "query",
                  "format": "json",
                  "formatversion": "2",
                  "generator": "search",
                  "gsrsearch": query,
                  "gsrnamespace": "6",
                  "gsrlimit": "24",
                  "prop": "imageinfo",
                  "iiprop": "url|size|dimensions|mime|extmetadata",
                  "iiurlwidth": "1600",
                  "iiextmetadatalanguage": "en",
                  "iiextmetadatafilter":
                      "Artist|LicenseShortName|UsageTerms|LicenseUrl|ImageDescription|Credit"
              }
              data = request_json(params)
              pages = data.get("query", {}).get("pages", [])
              candidates = []

              for rank, page in enumerate(pages):
                  infos = page.get("imageinfo") or []
                  if not infos:
                      continue
                  info = infos[0]
                  mime = info.get("mime", "")
                  if mime not in SAFE_MIMES:
                      continue

                  width = int(info.get("width") or 0)
                  height = int(info.get("height") or 0)
                  if width < 1200 or height < 650 or height <= 0:
                      continue

                  ratio = width / height
                  if ratio < 1.28 or ratio > 2.65:
                      continue

                  meta = info.get("extmetadata") or {}
                  license_name = metadata_value(meta, "LicenseShortName") or metadata_value(meta, "UsageTerms")
                  if not license_is_safe(license_name):
                      continue

                  title = page.get("title", "")
                  title_lower = title.lower()
                  if any(word in title_lower for word in BAD_TITLE_WORDS):
                      continue

                  thumb = info.get("thumburl") or info.get("url")
                  if not thumb:
                      continue

                  creator = metadata_value(meta, "Artist") or "Wikimedia Commons contributor"
                  license_url = metadata_value(meta, "LicenseUrl")
                  description = metadata_value(meta, "ImageDescription")

                  # Prefer widescreen-ish high resolution images near the top
                  # of Commons search, while retaining deterministic selection.
                  ratio_score = max(0.0, 1.0 - abs(ratio - (16/9)) / 1.1)
                  megapixels = min((width * height) / 1_000_000, 20)
                  score = ratio_score * 8 + megapixels * .08 - rank * .08

                  candidates.append({
                      "score": score,
                      "title": title,
                      "url": thumb,
                      "mime": mime,
                      "width": width,
                      "height": height,
                      "creator": creator[:180],
                      "license": license_name[:80],
                      "license_url": license_url,
                      "description": description[:260],
                      "source_page":
                          "https://commons.wikimedia.org/wiki/" +
                          urllib.parse.quote(title.replace(" ", "_"), safe=":_()/,-")
                  })

              candidates.sort(key=lambda item: (-item["score"], item["title"]))
              return candidates

          def download(url, target):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": USER_AGENT, "Accept": "image/*"}
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read(6_000_001)
                  content_type = response.headers.get_content_type()
              if len(data) > 6_000_000:
                  raise RuntimeError("download exceeded 6 MB safety limit")
              if content_type not in SAFE_MIMES:
                  raise RuntimeError(f"unexpected content type: {content_type}")
              target.write_bytes(data)
              return content_type

          OUT_DIR.mkdir(parents=True, exist_ok=True)

          try:
              manifest = json.loads(MANIFEST.read_text(encoding="utf-8"))
              if not isinstance(manifest, dict):
                  manifest = {}
          except Exception:
              manifest = {}

          wallpapers = manifest.get("wallpapers")
          if not isinstance(wallpapers, dict):
              wallpapers = {}

          changed = False

          for theme_id, theme in THEMES.items():
              existing = wallpapers.get(theme_id) or {}
              existing_path = Path(existing.get("image", "")) if existing.get("image") else None

              if not FORCE and existing_path and existing_path.exists():
                  print(f"{theme_id}: keeping existing {existing_path}")
                  continue

              print(f"{theme_id}: searching Wikimedia Commons...")
              try:
                  candidates = search_candidates(theme["query"])
              except Exception as exc:
                  print(f"{theme_id}: search failed: {exc}")
                  continue

              if not candidates:
                  print(f"{theme_id}: no suitable landscape image found")
                  continue

              selected = candidates[0]
              ext = SAFE_MIMES[selected["mime"]]

              # Remove an older version with a different extension only when
              # replacing this theme.
              for stale in OUT_DIR.glob(theme_id + ".*"):
                  if stale.name == ".gitkeep":
                      continue
                  try:
                      stale.unlink()
                  except OSError:
                      pass

              target = OUT_DIR / f"{theme_id}{ext}"

              try:
                  actual_mime = download(selected["url"], target)
              except Exception as exc:
                  print(f"{theme_id}: download failed: {exc}")
                  continue

              # If the response MIME differed, normalize the extension.
              actual_ext = SAFE_MIMES[actual_mime]
              if target.suffix != actual_ext:
                  corrected = OUT_DIR / f"{theme_id}{actual_ext}"
                  target.replace(corrected)
                  target = corrected

              wallpapers[theme_id] = {
                  "label": theme["label"],
                  "image": target.as_posix(),
                  "creator": selected["creator"],
                  "license": selected["license"],
                  "license_url": selected["license_url"],
                  "source_page": selected["source_page"],
                  "source_title": selected["title"],
                  "description": selected["description"],
                  "original_width": selected["width"],
                  "original_height": selected["height"],
                  "source": "Wikimedia Commons"
              }
              changed = True
              print(f"{theme_id}: saved {target} — {selected['title']}")

              # Be polite to Commons when the first library is being built.
              time.sleep(1.0)

          if changed or not MANIFEST.exists():
              output = {
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "source": "Wikimedia Commons",
                  "note":
                      "Images are cached locally. See each entry for creator, "
                      "license and Wikimedia Commons source page.",
                  "wallpapers": wallpapers
              }
              MANIFEST.write_text(
                  json.dumps(output, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
          else:
              print("Wallpaper library already complete; no manifest rewrite needed.")

      - name: Commit wallpaper changes
        shell: bash
        run: |
          if git diff --quiet -- festival-wallpaper.json festival-wallpapers/; then
            echo "No festival wallpaper changes."
            exit 0
          fi

          git config user.name "senaisha-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add festival-wallpaper.json festival-wallpapers/
          git commit -m "Update festival wallpaper library"
          git push
